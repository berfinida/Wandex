<!doctype html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Wandex ile dünya şehirlerinin hava durumu, hava kalitesi, gün doğumu, tatiller ve seyahat koşullarını kaynak zamanlarıyla inceleyin." />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
  <meta name="theme-color" content="#080a0f" />
  <meta name="application-name" content="Wandex" />
  <link rel="canonical" href="https://wandex-seven.vercel.app/" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wandex" />
  <meta property="og:title" content="Wandex — Akıllı Seyahat ve Şehir Bilgi Panosu" />
  <meta property="og:description" content="Hava durumu, hava kalitesi, yerel saat, tatiller ve seyahat planı tek yerde." />
  <meta property="og:url" content="https://wandex-seven.vercel.app/" />
  <meta property="og:image" content="https://wandex-seven.vercel.app/preview.png" />
  <meta property="og:image:alt" content="Wandex şehir ve seyahat bilgi panosu" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wandex — Akıllı Seyahat ve Şehir Bilgi Panosu" />
  <meta name="twitter:description" content="Şehir verilerini kaynak zamanlarıyla inceleyin ve seyahatinizi planlayın." />
  <meta name="twitter:image" content="https://wandex-seven.vercel.app/preview.png" />
  <title>Wandex — Akıllı Seyahat ve Şehir Bilgi Panosu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script>
    (function() {
      const key = 'wandex_theme_v1';
      let saved;
      try { saved = localStorage.getItem(key); } catch { /* Storage may be blocked. */ }
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialTheme = saved === 'light' || saved === 'dark' ? saved : (systemDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', initialTheme);
    })();
  </script>

  <link rel="stylesheet" href="style.css?v=20261017.6" />
  <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"WebApplication",
      "name":"Wandex",
      "url":"https://wandex-seven.vercel.app/",
      "applicationCategory":"TravelApplication",
      "operatingSystem":"Web",
      "inLanguage":["tr","en","de","fr","es","it","pt","nl","pl","ru","uk","ar","fa","he"],
      "description":"A city and travel information dashboard with weather, air quality, local time, holidays, currency rates, and source-time transparency.",
      "author":{"@type":"Person","name":"Berfin Nida Öztürk","url":"https://github.com/berfinida"},
      "isAccessibleForFree":true
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skipContent">İçeriğe geç</a>

  <div class="progress" id="progress"></div>
  <div class="toast-wrap"><div id="toast" class="toast" role="status" aria-live="polite"></div></div>

  <!-- ── HEADER ─────────────────────────────────────────── -->
  <header>
    <div class="header-inner">

      <a class="logo" href="#">
        <div class="logo-mark">🌐</div>
        <span class="logo-name">Wandex</span>
      </a>

      <div class="h-div"></div>

      <div class="search-row">
        <div class="search-input-wrap">
          <span class="search-icon">⌕</span>
          <input class="search-input" id="q" type="text" autocomplete="off" />
        </div>
        <button class="btn btn-blue" id="btnSearch"></button>
        <button class="btn btn-icon" id="btnLocate" title="">📍</button>
      </div>

      <label class="language-picker" for="langSelect">
        <span id="langLabel" class="sr-only"></span>
        <select id="langSelect" class="lang-select"></select>
      </label>

      <button class="btn btn-icon" id="btnTheme" aria-label="Tema değiştir" title="Tema değiştir">🌙</button>
      <button class="btn btn-icon" id="btnRefresh" title="Refresh">↻</button>
      <select class="fav-select" id="favSelect"></select>

    </div>
  </header>

  <!-- ── MAIN ───────────────────────────────────────────── -->
  <main id="main">
    <div id="sourceStatus" class="source-status" role="status" aria-live="polite" hidden></div>
    <div id="networkStatus" class="network-status" role="status" aria-live="polite" hidden></div>
    <section id="cityResults" class="card city-results" aria-labelledby="cityResultsTitle" hidden>
      <div class="results-heading">
        <h2 id="cityResultsTitle"></h2>
        <button class="btn btn-icon" id="btnCloseResults" type="button">×</button>
      </div>
      <div id="cityResultsList" class="city-results-list"></div>
    </section>
    <details class="source-disclosure">
      <summary data-i18n="dataSources"></summary>
      <p class="plan-hint" data-i18n="autoRefresh"></p>
      <div id="sourceDetails"></div>
    </details>
    <div class="quick-cities" id="quickCities">
      <button class="btn quick-chip" type="button" data-city="Istanbul">Istanbul</button>
      <button class="btn quick-chip" type="button" data-city="London">London</button>
      <button class="btn quick-chip" type="button" data-city="Paris">Paris</button>
      <button class="btn quick-chip" type="button" data-city="Tokyo">Tokyo</button>
      <button class="btn quick-chip" type="button" data-city="New York">New York</button>
    </div>
    <div class="recent-wrap" id="recentWrap" hidden>
      <div class="recent-title" data-i18n="recentSearches"></div>
      <div class="recent-list" id="recentList"></div>
    </div>

    <section class="welcome-card" aria-labelledby="welcomeTitle">
      <img id="welcomeImage" class="welcome-image" src="assets-wandex-istanbul-hero.webp" alt="" width="2000" height="786" fetchpriority="high" />
      <div class="welcome-content">
        <p class="eyebrow" data-i18n="welcomeEyebrow"></p>
        <h1 id="welcomeTitle" data-i18n="welcomeTitle"></h1>
        <p class="welcome-copy" data-i18n="welcomeCopy"></p>
        <div class="welcome-actions">
          <button class="btn btn-blue" id="btnStartSearch" type="button" data-i18n="welcomeStart"></button>
          <button class="btn welcome-secondary" id="btnExploreIstanbul" type="button" data-i18n="welcomeExplore"></button>
        </div>
      </div>
      <div class="welcome-steps" aria-label="How Wandex works">
        <span><b>01</b><i data-i18n="welcomeStepSearch"></i></span>
        <span><b>02</b><i data-i18n="welcomeStepCompare"></i></span>
        <span><b>03</b><i data-i18n="welcomeStepPlan"></i></span>
      </div>
      <p class="welcome-trust" data-i18n="welcomeTrust"></p>
    </section>

    <div class="card compare-card">
      <div class="section-label"><span data-i18n="compareTitle"></span></div>
      <div class="compare-top">
        <div class="compare-input-wrap">
          <span class="search-icon">⌕</span>
          <input class="compare-input" id="compareQ" type="text" autocomplete="off" />
        </div>
        <button class="btn btn-xs" id="btnCompareAdd"></button>
        <button class="btn btn-xs" id="btnCompareClear" hidden></button>
      </div>
      <div id="comparePanel" class="compare-panel" hidden>
        <div class="compare-head">
          <span data-i18n="compareMetric"></span>
          <span id="cmpMainName">—</span>
          <span id="cmpOtherName">—</span>
        </div>
        <div id="compareRows"></div>
      </div>
    </div>

    <section class="brief-grid" aria-label="Travel brief">
      <article class="card city-brief" aria-labelledby="briefTitle">
        <div class="section-label" id="briefTitle" data-i18n="briefTitle"></div>
        <p id="briefIntro" class="brief-intro" aria-live="polite"></p>
        <div id="briefMetrics" class="brief-metrics"></div>
        <div class="packing-title" data-i18n="packingTitle"></div>
        <div id="packingList" class="packing-list"></div>
        <p class="brief-note" data-i18n="briefNote"></p>
      </article>

      <article class="card budget-card" aria-labelledby="budgetTitle">
        <div class="section-label" id="budgetTitle" data-i18n="budgetTitle"></div>
        <p class="budget-copy" data-i18n="budgetCopy"></p>
        <label class="budget-input-label" for="budgetAmount" data-i18n="budgetAmount"></label>
        <div class="budget-input-wrap">
          <span>USD</span>
          <input id="budgetAmount" inputmode="decimal" type="number" min="0" step="0.01" value="100" />
        </div>
        <div id="budgetResults" class="budget-results" aria-live="polite"></div>
        <p id="budgetMeta" class="brief-note"></p>
      </article>
    </section>

    <!-- HERO -->
    <div class="card">
      <div class="hero-grid">
        <div>
          <div id="placeTitle" class="city-name">—</div>
          <div id="placeMeta" class="city-meta">—</div>
          <div id="travelScoreCard" class="travel-score" aria-live="polite">
            <div class="travel-score-top">
              <span class="travel-score-label" data-i18n="travelScoreTitle"></span>
              <span id="travelScoreStatus" class="travel-score-status">—</span>
            </div>
            <div class="travel-score-main">
              <span id="travelScoreValue">—</span>
              <span class="travel-score-max">/ 100</span>
            </div>
            <div id="travelScoreHint" class="travel-score-hint">—</div>
          </div>

          <div class="kpis">
            <div class="kpi">
              <div class="kpi-label" data-i18n="temp"></div>
              <div id="kpiTemp" class="kpi-val" style="color:var(--amber)">—</div>
            </div>
            <div class="kpi">
              <div class="kpi-label" data-i18n="wind"></div>
              <div id="kpiWind" class="kpi-val" style="color:#93c5fd">—</div>
            </div>
            <div class="kpi">
              <div class="kpi-label" data-i18n="localTime"></div>
              <div id="kpiTime" class="kpi-val" style="color:var(--violet)">—</div>
            </div>
            <div class="kpi">
              <div class="kpi-label">AQI</div>
              <div id="kpiAqi" class="kpi-val" style="color:var(--green)">—</div>
            </div>
          </div>

          <div class="hero-panels">
            <div class="panel">
              <div class="panel-title" data-i18n="sunTitle"></div>
              <div class="kv-row"><span class="kv-k" data-i18n="sunrise"></span><span id="sunrise" class="kv-v">—</span></div>
              <div class="kv-row"><span class="kv-k" data-i18n="sunset"></span><span id="sunset" class="kv-v">—</span></div>
              <div class="kv-row"><span class="kv-k" data-i18n="dayLength"></span><span id="daylen" class="kv-v">—</span></div>
            </div>
            <div class="panel">
              <div class="panel-title" data-i18n="fxTitle"></div>
              <div class="kv-row"><span class="kv-k">TRY</span><span id="fxTry" class="kv-v">—</span></div>
              <div class="kv-row"><span class="kv-k">EUR</span><span id="fxEur" class="kv-v">—</span></div>
              <div class="kv-row"><span class="kv-k">GBP</span><span id="fxGbp" class="kv-v">—</span></div>
            </div>
          </div>

          <div class="hero-actions">
            <button class="btn btn-xs" id="btnCopy"><span data-i18n="copyCoords"></span></button>
            <button class="btn btn-xs" id="btnShare" aria-label="Şehri paylaş" title="Şehri paylaş"><span data-i18n="shareCity"></span></button>
            <button class="btn btn-xs" id="btnSave" aria-label="Favoriye ekle" title="Favoriye ekle">★</button>
            <span id="aqiLabel" style="font-size:12px;font-weight:500;color:var(--text-3);align-self:center;margin-left:4px"></span>
          </div>
        </div>

        <div class="hero-map">
          <div id="map"></div>
          <div class="map-bar">
            <span id="coords">—</span>
            <span id="tz">—</span>
          </div>
        </div>
      </div>
    </div>

    <!-- WEATHER -->
    <div class="card">
      <div class="section-label" data-i18n="weatherTitle"></div>
      <div class="weather-toolbar">
        <div id="tempUnits" class="lang-pill" role="group">
          <button id="btnCelsius" class="lang-opt" type="button">°C</button>
          <button id="btnFahrenheit" class="lang-opt" type="button">°F</button>
        </div>
      </div>
      <div id="weatherNow" class="weather-now">—</div>
      <div class="temp-chart-wrap">
      <canvas id="tempChart" class="temp-chart-canvas"></canvas>
      </div>
      <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px" data-i18n="hourlyLabel"></div>
      <div id="hourly" class="hourly-scroll"></div>
      <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:18px 0 10px" data-i18n="dailyLabel"></div>
      <div id="daily" class="data-table"></div>
      <div class="best-day">
        <div class="panel-title" data-i18n="bestDay"></div>
        <div id="bestDaySummary"></div>
        <p class="plan-hint" data-i18n="bestDayHint"></p>
      </div>
    </div>

    <section class="card trip-plan" aria-labelledby="planTitle">
      <div class="section-label" id="planTitle" data-i18n="planTitle"></div>
      <div class="plan-heading"><strong id="planCity">—</strong><span id="planProgress"></span></div>
      <p class="plan-hint" data-i18n="planHint"></p>
      <div class="plan-grid">
        <div class="plan-fields">
          <label for="planDate" data-i18n="planDate"></label>
          <input id="planDate" type="date" />
          <label for="planEndDate" data-i18n="planEndDate"></label>
          <input id="planEndDate" type="date" />
          <div class="plan-inline-fields">
            <label for="planPeople"><span data-i18n="planPeople"></span><input id="planPeople" type="number" min="1" max="20" value="1" /></label>
            <label for="planBudget"><span data-i18n="planBudget"></span><input id="planBudget" type="number" min="0" step="1" /></label>
          </div>
          <label for="planCurrency" data-i18n="planCurrency"></label>
          <select id="planCurrency"><option value="USD">USD</option><option value="EUR">EUR</option><option value="TRY">TRY</option><option value="GBP">GBP</option></select>
          <label for="planPace" data-i18n="planPace"></label>
          <select id="planPace"><option value="relaxed" data-i18n="paceRelaxed"></option><option value="balanced" data-i18n="paceBalanced"></option><option value="active" data-i18n="paceActive"></option></select>
          <fieldset class="plan-interests"><legend data-i18n="planInterests"></legend><div id="planInterests"></div></fieldset>
          <button id="btnPlanOutline" class="btn" type="button" data-i18n="planGenerate"></button>
          <div id="planOutline" class="plan-outline" aria-live="polite"></div>
          <label for="planNotes" data-i18n="planNotes"></label>
          <textarea id="planNotes" rows="5" maxlength="4000"></textarea>
        </div>
        <div id="planChecklist" class="plan-checklist"></div>
      </div>
      <div class="plan-actions">
        <span id="planSaveStatus" role="status"></span>
        <button class="btn btn-xs" id="btnExportPlan" type="button" data-i18n="planExport"></button>
      </div>
    </section>

    <!-- AIR QUALITY -->
    <div class="card">
      <div class="section-label" data-i18n="airTitle"></div>
      <div id="aqiBarWrap" class="aqi-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="500" aria-valuenow="0" aria-valuetext="AQI —">
        <div class="aqi-bar-track">
          <div id="aqiBarFill" class="aqi-bar-fill"></div>
        </div>
        <div class="aqi-bar-meta">
          <span id="aqiBarText">AQI —</span>
          <span>0-500</span>
        </div>
      </div>
      <div id="air" class="air-grid"></div>
      <div style="font-size:11px;color:var(--text-3);margin-top:12px;font-weight:400" data-i18n="airSource"></div>
    </div>

    <!-- COUNTRY + HOLIDAYS -->
    <div class="ch-grid">
      <div class="card">
        <div class="section-label" data-i18n="countryTitle"></div>
        <div id="country"></div>
      </div>
      <div class="card">
        <div class="section-label">
          <span data-i18n="holidaysTitle"></span>
          <span id="holidayYear" style="font-weight:400;text-transform:none;letter-spacing:0;margin-left:4px;font-size:11px"></span>
        </div>
        <div id="holidays" class="data-table"></div>
      </div>
    </div>

    <!-- CRYPTO -->
    <div class="card">
      <div class="section-label" data-i18n="cryptoTitle"></div>
      <div id="crypto" class="crypto-row"></div>
    </div>

  </main>

  <footer>
    <span class="footer-main" data-i18n="footer"></span>
    <div class="footer-credit">
      <span id="builtBy">Built by</span> Berfin Nida Öztürk ·
      <a class="footer-link" href="https://github.com/berfinida" target="_blank" rel="noopener noreferrer" aria-label="Berfin Nida Öztürk GitHub profile">GitHub</a>
      ·
      <a class="footer-link" href="https://www.linkedin.com/in/berfin-nida-%C3%B6zt%C3%BCrk-6a12131b7/" target="_blank" rel="noopener noreferrer" aria-label="Berfin Nida Öztürk LinkedIn profile">LinkedIn</a>
    </div>
    <div class="footer-copyright" data-i18n="copyright"></div>
  </footer>

  <noscript>
    <div class="noscript-notice">Wandex şehir verilerini görüntülemek için tarayıcınızda JavaScript’i etkinleştirin.</div>
  </noscript>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="locales.js?v=20261017.6"></script>
  <script src="app.js?v=20261017.6"></script>
</body>
</html>
